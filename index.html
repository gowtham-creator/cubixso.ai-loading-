<!-- Crawlable fallback. This is a Vite SPA: the served HTML was 2,114 bytes with
     an empty #app, no <h1>, and no <a href> — so Googlebot's first-wave crawl
     saw no content and, critically, no link to the real site at
     app.cubixso.com. The "Launch" button only exists after React mounts, so
     there was no discovery path to the actual website at all.

     React replaces this markup on mount. It deliberately restates exactly what
     the rendered page says (same headline, same copy, same single Launch link),
     so it is a pre-hydration fallback and not cloaking — crawler and visitor
     are shown the same thing. Keep it in sync if Velorah's copy changes. -->
<div id="app">
  <h1>Cubixso.ai — AI-native technology, now live</h1>
  <p>
    The Cubixso website is now live. Step inside our AI-native world of agentic
    systems, RAG platforms, and education technology for the autonomous
    enterprise, engineered across Hyderabad, the UAE, and the US.
  </p>
  <p><a href="https://app.cubixso.com">Launch the Cubixso website</a></p>
</div>
